name: NSE 200 DMA Scanner

on:
  workflow_dispatch:

  schedule:
    # 7:00 PM IST = 13:30 UTC
    # Monday to Friday
    - cron: "30 13 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  scan:

    runs-on: ubuntu-latest

    # IMPORTANT:
    # GitHub Pages deployment requires this environment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # =================================================
      # 1. Checkout repository
      # =================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =================================================
      # 2. Setup Python
      # =================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =================================================
      # 3. Install dependencies
      # =================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # =================================================
      # 4. Run NSE 200 DMA scanner
      # =================================================

      - name: Run NSE 200 DMA scanner
        run: |
          python scanner_nse500.py


      # =================================================
      # 5. Run fundamental analysis
      # =================================================

      - name: Run fundamental analysis
        run: |
          python fundamentals.py


      # =================================================
      # 6. Build portfolio recommendations
      # =================================================

      - name: Build portfolio recommendations
        run: |
          python portfolio_builder.py


      # =================================================
      # 7. Check generated files
      # =================================================

      - name: Show output files
        run: |

          echo "======================================"
          echo "GENERATED OUTPUT FILES"
          echo "======================================"

          ls -lah output/

          echo ""
          echo "Scanner CSV:"
          head -5 output/NSE_200DMA_Recovery_Scanner.csv

          echo ""
          echo "Portfolio CSV:"
          head -10 output/NSE_Portfolio_Recommendations.csv


      # =================================================
      # 8. Commit updated scanner + portfolio data
      # =================================================

      - name: Commit scanner and portfolio data
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit -m "Update scanner fundamentals and portfolio"

            git push

          fi


      # =================================================
      # 9. Setup GitHub Pages
      # =================================================

      - name: Setup Pages
        uses: actions/configure-pages@v5


      # =================================================
      # 10. Upload dashboard
      # =================================================

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .


      # =================================================
      # 11. Deploy dashboard
      # =================================================

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
