name: NSE 200 DMA Scanner

on:
  workflow_dispatch:

  schedule:
    # 7:00 PM IST = 13:30 UTC
    # Monday to Friday
    - cron: "30 13 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  scan:

    runs-on: ubuntu-latest

    # Required for deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # -----------------------------------------
      # 1. Checkout repository
      # -----------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------
      # 2. Setup Python
      # -----------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # -----------------------------------------
      # 3. Install dependencies
      # -----------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # -----------------------------------------
      # 4. Run NSE 200 DMA Scanner
      # -----------------------------------------

      - name: Run NSE 200 DMA scanner
        run: |
          echo "======================================"
          echo " NSE 200 DMA SCANNER"
          echo "======================================"
          python scanner_nse500.py


      # -----------------------------------------
      # 5. Run Fundamental Analysis
      # -----------------------------------------

      - name: Run fundamental analysis
        run: |
          echo "======================================"
          echo " FUNDAMENTAL ANALYSIS"
          echo "======================================"
          python fundamentals.py


      # -----------------------------------------
      # 6. Check Generated Files
      # -----------------------------------------

      - name: Show output files
        run: |
          echo "======================================"
          echo " GENERATED FILES"
          echo "======================================"

          ls -lah output/

          echo ""
          echo "CSV preview:"
          head -5 output/NSE_200DMA_Recovery_Scanner.csv


      # -----------------------------------------
      # 7. Commit Updated Scanner Data
      # -----------------------------------------

      - name: Commit scanner data
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update NSE 200 DMA and fundamentals"
            git push
          fi


      # -----------------------------------------
      # 8. Setup GitHub Pages
      # -----------------------------------------

      - name: Setup Pages
        uses: actions/configure-pages@v5


      # -----------------------------------------
      # 9. Upload Dashboard to Pages
      # -----------------------------------------

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .


      # -----------------------------------------
      # 10. Deploy Dashboard
      # -----------------------------------------

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
