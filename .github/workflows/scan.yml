name: CARJ NSE Smart Stock Scanner

on:

  workflow_dispatch:

  schedule:

    # 7:00 PM IST
    # 13:30 UTC
    # Monday-Friday

    - cron: "30 13 * * 1-5"


permissions:

  contents: write

  pages: write

  id-token: write


concurrency:

  group: "pages"

  cancel-in-progress: false


jobs:

  scan:

    runs-on: ubuntu-latest


    steps:


      # =========================================
      # 1. CHECKOUT
      # =========================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # =========================================
      # 2. PYTHON
      # =========================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # =========================================
      # 3. DEPENDENCIES
      # =========================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install \
            pandas \
            numpy \
            requests \
            yfinance \
            openpyxl


      # =========================================
      # 4. FULL NSE SCANNER
      # =========================================

      - name: Run Full NSE Scanner

        run: |

          echo "======================================"

          echo "FULL NSE EQUITY SCANNER"

          echo "======================================"

          python scanner_nse500.py


      # =========================================
      # 5. FUNDAMENTALS — ALL STOCKS
      # =========================================

      - name: Run Fundamentals

        run: |

          echo "======================================"

          echo "FULL FUNDAMENTAL ANALYSIS"

          echo "======================================"

          python fundamentals.py


      # =========================================
      # 6. CHECK OUTPUT
      # =========================================

      - name: Check generated files

        run: |

          echo ""

          echo "Generated files:"

          ls -lah output/


          echo ""

          echo "CSV rows:"

          wc -l output/NSE_200DMA_Recovery_Scanner.csv


          echo ""

          echo "CSV preview:"

          head -5 \
            output/NSE_200DMA_Recovery_Scanner.csv


      # =========================================
      # 7. COMMIT DATA
      # =========================================

      - name: Commit scanner data

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add output/

          git add data/


          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Update full NSE scanner and fundamentals"

            git push

          fi


      # =========================================
      # 8. GITHUB PAGES
      # =========================================

      - name: Setup Pages

        uses: actions/configure-pages@v5


      # =========================================
      # 9. UPLOAD SITE
      # =========================================

      - name: Upload Pages artifact

        uses: actions/upload-pages-artifact@v3

        with:

          path: .


      # =========================================
      # 10. DEPLOY
      # =========================================

      - name: Deploy to GitHub Pages

        id: deployment

        uses: actions/deploy-pages@v4
