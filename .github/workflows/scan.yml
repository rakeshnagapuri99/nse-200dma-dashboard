name: NSE 200 DMA Scanner

on:
  workflow_dispatch:

  schedule:
    # 7:00 PM IST = 13:30 UTC
    # Monday to Friday
    - cron: "30 13 * * 1-5"

permissions:
  contents: write

jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------
      # 1. Get repository
      # -----------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------
      # 2. Setup Python
      # -----------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # -----------------------------------------
      # 3. Install packages
      # -----------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # -----------------------------------------
      # 4. Run NSE technical scanner
      # -----------------------------------------

      - name: Run NSE 200 DMA scanner
        run: |
          python scanner_nse500.py


      # -----------------------------------------
      # 5. Add fundamental analysis
      # -----------------------------------------

      - name: Run fundamental analysis
        run: |
          python fundamentals.py


      # -----------------------------------------
      # 6. Check generated files
      # -----------------------------------------

      - name: Show output files
        run: |
          echo "Generated files:"
          ls -lah output/

          echo ""
          echo "CSV preview:"
          head -5 output/NSE_200DMA_Recovery_Scanner.csv


      # -----------------------------------------
      # 7. Commit updated data
      # -----------------------------------------

      - name: Commit updated scanner data
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update NSE 200 DMA and fundamentals"
            git push
          fi
